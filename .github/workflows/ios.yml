# Reserv: bygger iPhone-appen hos GitHub. Startas bara för hand (Actions → iPhone-appen → Run workflow).
# Det vanliga bygget görs hos Codemagic (codemagic.yaml), eftersom GitHub inte ger kontot några Mac-maskiner.
name: iPhone-appen
on: workflow_dispatch
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Bygg och skicka till App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}0
        run: native/build-ios.sh
